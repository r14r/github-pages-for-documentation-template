title: Documentation Template
description: Reusable Jekyll documentation website
url: "https://r14r.github.io"
baseurl: "/unified-office-workshop-public"
project:
  name: Documentation Template
  url: "https://r14r.github.io/unified-office-workshop-public/"
author:
  name: Documentation Template
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: default
locale: en
markdown: kramdown
permalink: pretty
search: true
plugins:
  - jekyll-include-cache
sass:
  quiet_deps: true
defaults:
  - scope:
      path: ""
    values:
      layout: single
      toc: true
      toc_label: "On this page"
      toc_sticky: true
      sidebar:
        nav: docs
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - justfile
  - SOURCE.md
  - VERSION
  - update-cli.yaml
  - vendor
  - docs
  - _site
